  <text x="30" y="130" class="log-text log-info">[2026-08-19 19:06:07] INFO   | SSL cert renewed: *.meghvyas.dev</text>
  <text x="30" y="150" class="log-text log-debug">[2026-08-19 19:06:09] DEBUG  | Circuit breaker: CLOSED</text>
