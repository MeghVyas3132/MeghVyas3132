  <text x="30" y="130" class="log-text log-debug">[2026-08-18 17:35:03] DEBUG  | Rate limit check: 5712 req/s</text>
  <text x="30" y="150" class="log-text log-info">[2026-08-18 17:35:05] INFO   | Request processed: 200 OK (22ms)</text>
  <text x="30" y="170" class="log-text log-info">[2026-08-18 17:35:07] INFO   | Load balancer: distributing traffic</text>
  <text x="30" y="190" class="log-text log-info">[2026-08-18 17:35:09] INFO   | Auto-scaling triggered: +2 pods</text>
  <text x="30" y="210" class="log-text log-warn">[2026-08-18 17:35:11] WARN   | High latency detected: payment-service</text>
  <text x="30" y="230" class="log-text log-debug">[2026-08-18 17:35:13] DEBUG  | Cache hit: user:9b4a5</text>
  <text x="30" y="250" class="log-text log-info">[2026-08-18 17:35:15] INFO   | Metric exported: cpu_usage=94%</text>
  <text x="30" y="270" class="log-text log-info">[2026-08-18 17:35:17] INFO   | Metric exported: cpu_usage=75%</text>
  <text x="30" y="290" class="log-text log-info">[2026-08-18 17:35:19] INFO   | Pod auth-service-5f5d8 started</text>
