  <text x="30" y="150" class="log-text log-info">[2026-10-12 07:59:18] INFO   | Container started: api-gateway-8b3f6</text>
  <text x="30" y="170" class="log-text log-debug">[2026-10-12 07:59:20] DEBUG  | Circuit breaker: CLOSED</text>
  <text x="30" y="190" class="log-text log-info">[2026-10-12 07:59:22] INFO   | Pod user-service-2f8a2 started</text>
