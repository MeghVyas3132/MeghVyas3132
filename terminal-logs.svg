  <text x="30" y="170" class="log-text log-info">[2026-08-16 18:39:47] INFO   | Request processed: 200 OK (17ms)</text>
  <text x="30" y="190" class="log-text log-info">[2026-08-16 18:39:49] INFO   | Request processed: 200 OK (49ms)</text>
