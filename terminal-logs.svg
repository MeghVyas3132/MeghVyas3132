<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .terminal-bg { fill: #0a0a0a; }
      .terminal-border { fill: none; stroke: #404040; stroke-width: 2; }
      .terminal-title { font: bold 16px 'Courier New', monospace; fill: #ffffff; }
      .log-text { font: 12px 'Courier New', monospace; }
      .log-info { fill: #fdba74; }
      .log-warn { fill: #fcd34d; }
      .log-debug { fill: #a8a29e; }
      .cursor { fill: #fdba74; }
      @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
      .blinking { animation: blink 1s infinite; }
    </style>
  </defs>
  
  <rect width="1200" height="400" class="terminal-bg"/>
  <rect x="5" y="5" width="1190" height="390" class="terminal-border" rx="8"/>
  
  <!-- Terminal Header -->
  <rect x="15" y="15" width="1170" height="35" fill="#1a1a1a" rx="5"/>
  <text x="30" y="38" class="terminal-title">LIVE SYSTEM LOGS [LAST 60 SECONDS]</text>
  
  <!-- Log Lines -->
  <text x="30" y="70" class="log-text log-info">[2026-10-21 20:45:20] INFO   | Metric exported: cpu_usage=92%</text>
  <text x="30" y="90" class="log-text log-info">[2026-10-21 20:45:22] INFO   | Container started: user-service-6c5e3</text>
  <text x="30" y="110" class="log-text log-warn">[2026-10-21 20:45:24] WARN   | High latency detected: api-gateway</text>
  <text x="30" y="130" class="log-text log-debug">[2026-10-21 20:45:26] DEBUG  | Circuit breaker: CLOSED</text>
  <text x="30" y="150" class="log-text log-info">[2026-10-21 20:45:28] INFO   | Pod auth-service-4c9d5 started</text>
  <text x="30" y="170" class="log-text log-info">[2026-10-21 20:45:30] INFO   | Request processed: 200 OK (15ms)</text>
  <text x="30" y="190" class="log-text log-debug">[2026-10-21 20:45:32] DEBUG  | Circuit breaker: CLOSED</text>
  <text x="30" y="210" class="log-text log-info">[2026-10-21 20:45:34] INFO   | Database query optimized (72ms→11ms)</text>
  <text x="30" y="230" class="log-text log-debug">[2026-10-21 20:45:36] DEBUG  | Rate limit check: 8282 req/s</text>
  <text x="30" y="250" class="log-text log-debug">[2026-10-21 20:45:38] DEBUG  | Rate limit check: 7205 req/s</text>
  <text x="30" y="270" class="log-text log-warn">[2026-10-21 20:45:40] WARN   | High latency detected: auth-service</text>
  <text x="30" y="290" class="log-text log-info">[2026-10-21 20:45:42] INFO   | Pod auth-service-1d9d4 started</text>
