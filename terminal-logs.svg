  <text x="30" y="330" class="log-text log-debug">[2026-08-22 10:17:49] DEBUG  | Circuit breaker: CLOSED</text>
  <text x="30" y="350" class="log-text log-warn">[2026-08-22 10:17:51] WARN   | High latency detected: auth-service</text>
  
  <!-- Cursor -->
  <rect x="30" y="370" width="10" height="15" class="cursor blinking"/>
