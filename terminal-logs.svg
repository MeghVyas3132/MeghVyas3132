<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .terminal-bg { fill: #0a0a0a; }
      .terminal-border { fill: none; stroke: #404040; stroke-width: 2; }
      .terminal-title { font: bold 16px 'Courier New', monospace; fill: #ffffff; }
      .log-text { font: 12px 'Courier New', monospace; }
      .log-info { fill: #fdba74; }
      .log-warn { fill: #fcd34d; }
      .log-debug { fill: #a8a29e; }
      .cursor { fill: #fdba74; }
      @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
      .blinking { animation: blink 1s infinite; }
    </style>
  </defs>
  
  <rect width="1200" height="400" class="terminal-bg"/>
  <rect x="5" y="5" width="1190" height="390" class="terminal-border" rx="8"/>
  
  <!-- Terminal Header -->
  <rect x="15" y="15" width="1170" height="35" fill="#1a1a1a" rx="5"/>
  <text x="30" y="38" class="terminal-title">LIVE SYSTEM LOGS [LAST 60 SECONDS]</text>
  
  <!-- Log Lines -->
  <text x="30" y="70" class="log-text log-info">[2026-07-26 14:59:35] INFO   | SSL cert renewed: *.meghvyas.dev</text>
  <text x="30" y="90" class="log-text log-warn">[2026-07-26 14:59:37] WARN   | High latency detected: payment-service</text>
  <text x="30" y="110" class="log-text log-info">[2026-07-26 14:59:39] INFO   | Load balancer: distributing traffic</text>
  <text x="30" y="130" class="log-text log-info">[2026-07-26 14:59:41] INFO   | Backup completed: 831 MB</text>
  <text x="30" y="150" class="log-text log-info">[2026-07-26 14:59:43] INFO   | Backup completed: 767 MB</text>
  <text x="30" y="170" class="log-text log-warn">[2026-07-26 14:59:45] WARN   | High latency detected: auth-service</text>
  <text x="30" y="190" class="log-text log-debug">[2026-07-26 14:59:47] DEBUG  | Circuit breaker: CLOSED</text>
  <text x="30" y="210" class="log-text log-info">[2026-07-26 14:59:49] INFO   | Request processed: 200 OK (27ms)</text>
  <text x="30" y="230" class="log-text log-info">[2026-07-26 14:59:51] INFO   | Metric exported: cpu_usage=82%</text>
  <text x="30" y="250" class="log-text log-info">[2026-07-26 14:59:53] INFO   | Backup completed: 597 MB</text>
  <text x="30" y="270" class="log-text log-info">[2026-07-26 14:59:55] INFO   | Backup completed: 830 MB</text>
  <text x="30" y="290" class="log-text log-info">[2026-07-26 14:59:57] INFO   | SSL cert renewed: *.meghvyas.dev</text>
  <text x="30" y="310" class="log-text log-debug">[2026-07-26 14:59:59] DEBUG  | Cache hit: user:1d6e1</text>
  <text x="30" y="330" class="log-text log-info">[2026-07-26 15:00:01] INFO   | Pod payment-service-1c7f9 started</text>
  <text x="30" y="350" class="log-text log-info">[2026-07-26 15:00:03] INFO   | Backup completed: 501 MB</text>
  
