  <text x="30" y="150" class="log-text log-info">[2026-09-09 05:04:59] INFO   | Backup completed: 792 MB</text>
  <text x="30" y="170" class="log-text log-debug">[2026-09-09 05:05:01] DEBUG  | Cache hit: user:4a4a8</text>
  <text x="30" y="190" class="log-text log-debug">[2026-09-09 05:05:03] DEBUG  | Cache hit: user:5e2e3</text>
  <text x="30" y="210" class="log-text log-info">[2026-09-09 05:05:05] INFO   | Health check passed: api-gateway</text>
