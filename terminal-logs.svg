  <text x="30" y="150" class="log-text log-info">[2026-07-31 15:31:46] INFO   | Metric exported: cpu_usage=76%</text>
  <text x="30" y="170" class="log-text log-info">[2026-07-31 15:31:48] INFO   | Backup completed: 865 MB</text>
  <text x="30" y="190" class="log-text log-info">[2026-07-31 15:31:50] INFO   | Metric exported: cpu_usage=75%</text>
  <text x="30" y="210" class="log-text log-info">[2026-07-31 15:31:52] INFO   | Backup completed: 625 MB</text>
  <text x="30" y="230" class="log-text log-info">[2026-07-31 15:31:54] INFO   | Database query optimized (45ms→19ms)</text>
  <text x="30" y="250" class="log-text log-info">[2026-07-31 15:31:56] INFO   | Health check passed: payment-service</text>
