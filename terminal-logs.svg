  <text x="30" y="170" class="log-text log-info">[2026-10-04 15:49:10] INFO   | Pod payment-service-3d9d5 started</text>
  <text x="30" y="190" class="log-text log-info">[2026-10-04 15:49:12] INFO   | SSL cert renewed: *.meghvyas.dev</text>
