  <text x="30" y="130" class="log-text log-info">[2026-10-21 01:45:06] INFO   | Container started: notification-svc-7f7c2</text>
  <text x="30" y="150" class="log-text log-info">[2026-10-21 01:45:08] INFO   | Deploy rollout: 32/47 pods updated</text>
  <text x="30" y="170" class="log-text log-debug">[2026-10-21 01:45:10] DEBUG  | Rate limit check: 6296 req/s</text>
  <text x="30" y="190" class="log-text log-info">[2026-10-21 01:45:12] INFO   | Pod notification-svc-5d1f2 started</text>
  <text x="30" y="210" class="log-text log-info">[2026-10-21 01:45:14] INFO   | Deploy rollout: 32/47 pods updated</text>
  <text x="30" y="230" class="log-text log-info">[2026-10-21 01:45:16] INFO   | Database query optimized (92ms→18ms)</text>
  <text x="30" y="250" class="log-text log-debug">[2026-10-21 01:45:18] DEBUG  | Cache hit: user:1f3a4</text>
