  <text x="30" y="150" class="log-text log-debug">[2026-08-22 10:17:31] DEBUG  | Rate limit check: 7785 req/s</text>
  <text x="30" y="170" class="log-text log-info">[2026-08-22 10:17:33] INFO   | Container started: payment-service-1c3a2</text>
  <text x="30" y="190" class="log-text log-info">[2026-08-22 10:17:35] INFO   | Container started: auth-service-2b9a5</text>
  <text x="30" y="210" class="log-text log-warn">[2026-08-22 10:17:37] WARN   | High latency detected: payment-service</text>
  <text x="30" y="230" class="log-text log-info">[2026-08-22 10:17:39] INFO   | Request processed: 200 OK (12ms)</text>
  <text x="30" y="250" class="log-text log-info">[2026-08-22 10:17:41] INFO   | Auto-scaling triggered: +2 pods</text>
  <text x="30" y="270" class="log-text log-info">[2026-08-22 10:17:43] INFO   | Database query optimized (65ms→14ms)</text>
  <text x="30" y="290" class="log-text log-info">[2026-08-22 10:17:45] INFO   | Pod payment-service-9c5b8 started</text>
