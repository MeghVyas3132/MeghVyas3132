  <text x="30" y="110" class="log-text log-info">[2026-08-24 23:42:58] INFO   | Backup completed: 798 MB</text>
  <text x="30" y="130" class="log-text log-info">[2026-08-24 23:43:00] INFO   | Database query optimized (95ms→11ms)</text>
  <text x="30" y="150" class="log-text log-debug">[2026-08-24 23:43:02] DEBUG  | Cache hit: user:1c3a2</text>
  <text x="30" y="170" class="log-text log-info">[2026-08-24 23:43:04] INFO   | SSL cert renewed: *.meghvyas.dev</text>
  <text x="30" y="190" class="log-text log-info">[2026-08-24 23:43:06] INFO   | Container started: notification-svc-8a8e5</text>
  <text x="30" y="210" class="log-text log-info">[2026-08-24 23:43:08] INFO   | Request processed: 200 OK (32ms)</text>
  <text x="30" y="230" class="log-text log-info">[2026-08-24 23:43:10] INFO   | Database query optimized (55ms→13ms)</text>
  <text x="30" y="250" class="log-text log-info">[2026-08-24 23:43:12] INFO   | Metric exported: cpu_usage=79%</text>
  <text x="30" y="270" class="log-text log-info">[2026-08-24 23:43:14] INFO   | Database query optimized (43ms→24ms)</text>
  <text x="30" y="290" class="log-text log-info">[2026-08-24 23:43:16] INFO   | SSL cert renewed: *.meghvyas.dev</text>
  <text x="30" y="310" class="log-text log-info">[2026-08-24 23:43:18] INFO   | Container started: notification-svc-5d1d9</text>
  <text x="30" y="330" class="log-text log-info">[2026-08-24 23:43:20] INFO   | Request processed: 200 OK (12ms)</text>
  <text x="30" y="350" class="log-text log-debug">[2026-08-24 23:43:22] DEBUG  | Cache hit: user:6f5e2</text>
  
  <!-- Cursor -->
  <rect x="30" y="370" width="10" height="15" class="cursor blinking"/>
  <text x="45" y="382" class="log-text log-info">[Streaming...]</text>
</svg>