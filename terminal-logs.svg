  <text x="30" y="230" class="log-text log-info">[2026-08-23 14:54:09] INFO   | Backup completed: 750 MB</text>
  <text x="30" y="250" class="log-text log-info">[2026-08-23 14:54:11] INFO   | Request processed: 200 OK (32ms)</text>
  <text x="30" y="270" class="log-text log-info">[2026-08-23 14:54:13] INFO   | Request processed: 200 OK (31ms)</text>
  <text x="30" y="290" class="log-text log-info">[2026-08-23 14:54:15] INFO   | Load balancer: distributing traffic</text>
  <text x="30" y="310" class="log-text log-info">[2026-08-23 14:54:17] INFO   | Database query optimized (50ms→17ms)</text>
  <text x="30" y="330" class="log-text log-info">[2026-08-23 14:54:19] INFO   | Metric exported: cpu_usage=70%</text>
