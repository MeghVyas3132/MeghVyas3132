  <text x="30" y="190" class="log-text log-debug">[2026-07-28 22:15:53] DEBUG  | Circuit breaker: CLOSED</text>
  <text x="30" y="210" class="log-text log-info">[2026-07-28 22:15:55] INFO   | Deploy rollout: 22/47 pods updated</text>
  <text x="30" y="230" class="log-text log-info">[2026-07-28 22:15:57] INFO   | Request processed: 200 OK (32ms)</text>
  <text x="30" y="250" class="log-text log-info">[2026-07-28 22:15:59] INFO   | Metric exported: cpu_usage=91%</text>
