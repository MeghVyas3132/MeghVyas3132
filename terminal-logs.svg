  <text x="30" y="350" class="log-text log-debug">[2026-08-19 19:06:29] DEBUG  | Circuit breaker: CLOSED</text>
  
  <!-- Cursor -->
  <rect x="30" y="370" width="10" height="15" class="cursor blinking"/>
