  <text x="30" y="150" class="log-text log-warn">[2026-10-07 05:32:45] WARN   | High latency detected: auth-service</text>
  <text x="30" y="170" class="log-text log-info">[2026-10-07 05:32:47] INFO   | Auto-scaling triggered: +2 pods</text>
  <text x="30" y="190" class="log-text log-warn">[2026-10-07 05:32:49] WARN   | High latency detected: api-gateway</text>
  <text x="30" y="210" class="log-text log-debug">[2026-10-07 05:32:51] DEBUG  | Circuit breaker: CLOSED</text>
  <text x="30" y="230" class="log-text log-info">[2026-10-07 05:32:53] INFO   | Deploy rollout: 33/47 pods updated</text>
  <text x="30" y="250" class="log-text log-info">[2026-10-07 05:32:55] INFO   | Pod auth-service-1b5c3 started</text>
  <text x="30" y="270" class="log-text log-info">[2026-10-07 05:32:57] INFO   | Auto-scaling triggered: +1 pods</text>
  <text x="30" y="290" class="log-text log-info">[2026-10-07 05:32:59] INFO   | Load balancer: distributing traffic</text>
  <text x="30" y="310" class="log-text log-info">[2026-10-07 05:33:01] INFO   | Health check passed: payment-service</text>
  <text x="30" y="330" class="log-text log-debug">[2026-10-07 05:33:03] DEBUG  | Cache hit: user:4b2b2</text>
