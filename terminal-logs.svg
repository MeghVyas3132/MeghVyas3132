  <text x="30" y="130" class="log-text log-info">[2026-08-23 14:53:59] INFO   | Metric exported: cpu_usage=79%</text>
  <text x="30" y="150" class="log-text log-info">[2026-08-23 14:54:01] INFO   | Backup completed: 857 MB</text>
  <text x="30" y="170" class="log-text log-debug">[2026-08-23 14:54:03] DEBUG  | Circuit breaker: CLOSED</text>
  <text x="30" y="190" class="log-text log-info">[2026-08-23 14:54:05] INFO   | Backup completed: 566 MB</text>
