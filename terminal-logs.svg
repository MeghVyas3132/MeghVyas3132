<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .terminal-bg { fill: #0a0a0a; }
      .terminal-border { fill: none; stroke: #404040; stroke-width: 2; }
      .terminal-title { font: bold 16px 'Courier New', monospace; fill: #ffffff; }
      .log-text { font: 12px 'Courier New', monospace; }
      .log-info { fill: #fdba74; }
      .log-warn { fill: #fcd34d; }
      .log-debug { fill: #a8a29e; }
      .cursor { fill: #fdba74; }
      @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
      .blinking { animation: blink 1s infinite; }
    </style>
  </defs>
  
  <rect width="1200" height="400" class="terminal-bg"/>
  <rect x="5" y="5" width="1190" height="390" class="terminal-border" rx="8"/>
  
  <!-- Terminal Header -->
  <rect x="15" y="15" width="1170" height="35" fill="#1a1a1a" rx="5"/>
  <text x="30" y="38" class="terminal-title">LIVE SYSTEM LOGS [LAST 60 SECONDS]</text>
  
  <!-- Log Lines -->
  <text x="30" y="70" class="log-text log-info">[2026-08-11 07:33:04] INFO   | Backup completed: 652 MB</text>
  <text x="30" y="90" class="log-text log-info">[2026-08-11 07:33:06] INFO   | Database query optimized (56ms→20ms)</text>
  <text x="30" y="110" class="log-text log-debug">[2026-08-11 07:33:08] DEBUG  | Rate limit check: 5137 req/s</text>
  <text x="30" y="130" class="log-text log-info">[2026-08-11 07:33:10] INFO   | Metric exported: cpu_usage=84%</text>
  <text x="30" y="150" class="log-text log-info">[2026-08-11 07:33:12] INFO   | Load balancer: distributing traffic</text>
  <text x="30" y="170" class="log-text log-info">[2026-08-11 07:33:14] INFO   | Health check passed: user-service</text>
  <text x="30" y="190" class="log-text log-warn">[2026-08-11 07:33:16] WARN   | High latency detected: auth-service</text>
  <text x="30" y="210" class="log-text log-info">[2026-08-11 07:33:18] INFO   | SSL cert renewed: *.meghvyas.dev</text>
  <text x="30" y="230" class="log-text log-warn">[2026-08-11 07:33:20] WARN   | High latency detected: payment-service</text>
  <text x="30" y="250" class="log-text log-info">[2026-08-11 07:33:22] INFO   | Auto-scaling triggered: +1 pods</text>
  <text x="30" y="270" class="log-text log-info">[2026-08-11 07:33:24] INFO   | SSL cert renewed: *.meghvyas.dev</text>
  <text x="30" y="290" class="log-text log-debug">[2026-08-11 07:33:26] DEBUG  | Cache hit: user:3b1d3</text>
  <text x="30" y="310" class="log-text log-debug">[2026-08-11 07:33:28] DEBUG  | Rate limit check: 5776 req/s</text>
  <text x="30" y="330" class="log-text log-info">[2026-08-11 07:33:30] INFO   | Request processed: 200 OK (29ms)</text>
  <text x="30" y="350" class="log-text log-debug">[2026-08-11 07:33:32] DEBUG  | Rate limit check: 8476 req/s</text>
  
  <!-- Cursor -->
  <rect x="30" y="370" width="10" height="15" class="cursor blinking"/>
  <text x="45" y="382" class="log-text log-info">[Streaming...]</text>
</svg>