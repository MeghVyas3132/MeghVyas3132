  <text x="30" y="170" class="log-text log-info">[2026-11-20 21:21:33] INFO   | Auto-scaling triggered: +2 pods</text>
  <text x="30" y="190" class="log-text log-info">[2026-11-20 21:21:35] INFO   | Load balancer: distributing traffic</text>
  <text x="30" y="210" class="log-text log-debug">[2026-11-20 21:21:37] DEBUG  | Rate limit check: 6632 req/s</text>
  <text x="30" y="230" class="log-text log-info">[2026-11-20 21:21:39] INFO   | Load balancer: distributing traffic</text>
  <text x="30" y="250" class="log-text log-info">[2026-11-20 21:21:41] INFO   | Request processed: 200 OK (30ms)</text>
