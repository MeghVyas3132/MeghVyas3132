  <text x="30" y="190" class="log-text log-info">[2026-08-18 22:19:17] INFO   | Deploy rollout: 40/47 pods updated</text>
  <text x="30" y="210" class="log-text log-debug">[2026-08-18 22:19:19] DEBUG  | Rate limit check: 7362 req/s</text>
  <text x="30" y="230" class="log-text log-info">[2026-08-18 22:19:21] INFO   | Pod api-gateway-2b3d7 started</text>
  <text x="30" y="250" class="log-text log-info">[2026-08-18 22:19:23] INFO   | Container started: notification-svc-9c6d6</text>
