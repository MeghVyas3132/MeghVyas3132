  <text x="30" y="170" class="log-text log-info">[2026-08-09 18:01:59] INFO   | Pod api-gateway-6c2e7 started</text>
  <text x="30" y="190" class="log-text log-info">[2026-08-09 18:02:01] INFO   | Database query optimized (52ms→10ms)</text>
