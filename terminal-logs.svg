  <text x="30" y="230" class="log-text log-info">[2026-10-12 07:59:26] INFO   | Backup completed: 941 MB</text>
  <text x="30" y="250" class="log-text log-info">[2026-10-12 07:59:28] INFO   | Deploy rollout: 29/47 pods updated</text>
  <text x="30" y="270" class="log-text log-info">[2026-10-12 07:59:30] INFO   | SSL cert renewed: *.meghvyas.dev</text>
  <text x="30" y="290" class="log-text log-info">[2026-10-12 07:59:32] INFO   | Auto-scaling triggered: +3 pods</text>
