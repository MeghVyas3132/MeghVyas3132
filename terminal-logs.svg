  <text x="30" y="230" class="log-text log-warn">[2026-08-19 19:06:17] WARN   | High latency detected: api-gateway</text>
  <text x="30" y="250" class="log-text log-info">[2026-08-19 19:06:19] INFO   | Container started: payment-service-3e7d3</text>
